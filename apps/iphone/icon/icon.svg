<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Glade iPhone app icon: the Mac icon (apps/desktop/icon/icon.svg) drawn full-bleed, because iOS
       masks the corners itself and doesn't allow transparency. Same art, scaled from the macOS
       824px grid to the full 1024 canvas. Regenerate: in apps/iphone run `pnpm tauri icon icon/icon.svg`
       (writes src-tauri/icons and the Xcode asset catalog in src-tauri/gen/apple). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7ddbb0"/>
      <stop offset="0.55" stop-color="#34b39a"/>
      <stop offset="1" stop-color="#1c8a8c"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.24"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e8faf2"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#0b4f4a" flood-opacity="0.28"/>
    </filter>
    <!-- Veins cut out of the leaf so the background shows through. -->
    <mask id="veins" maskUnits="userSpaceOnUse" x="-400" y="-400" width="800" height="800">
      <rect x="-400" y="-400" width="800" height="800" fill="#ffffff"/>
      <g fill="none" stroke="#000000" stroke-linecap="round">
        <path d="M0 -205 L0 215" stroke-width="20"/>
        <path d="M0 -40 Q 56 -78 90 -136" stroke-width="14"/>
        <path d="M0 -40 Q -56 -78 -90 -136" stroke-width="14"/>
        <path d="M0 80 Q 66 42 108 -18" stroke-width="14"/>
        <path d="M0 80 Q -66 42 -108 -18" stroke-width="14"/>
      </g>
    </mask>
  </defs>
  <!-- full-bleed square (iOS applies its own rounded mask) -->
  <rect x="0" y="0" width="1024" height="1024" fill="url(#bg)"/>
  <rect x="0" y="0" width="1024" height="1024" fill="url(#gloss)"/>
  <!-- the leaf, tilted like one that just landed in a clearing -->
  <g transform="translate(512 512) scale(1.2427) translate(8 -12) rotate(38)" filter="url(#shadow)">
    <path d="M0 -300 C 205 -170 215 130 0 262 C -215 130 -205 -170 0 -300 Z" fill="url(#leaf)" mask="url(#veins)"/>
    <path d="M0 250 Q 4 300 -16 344" fill="none" stroke="#ffffff" stroke-width="24" stroke-linecap="round"/>
  </g>
</svg>
