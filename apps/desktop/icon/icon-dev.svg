<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Dev-build icon: icon.svg + a DEV band. Regenerate src-tauri/icons/dev/icon.icns with
       `pnpm tauri icon icon/icon-dev.svg -o /tmp/pi-dev-icons` and copy its icon.icns. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5b8cff"/>
      <stop offset="1" stop-color="#7a3cf0"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="squircle">
      <rect x="100" y="100" width="824" height="824" rx="185"/>
    </clipPath>
  </defs>
  <!-- macOS icon grid: 824px rounded square centred on a 1024 canvas -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#gloss)"/>
  <!-- π: top bar + two legs -->
  <g fill="#ffffff">
    <rect x="270" y="330" width="484" height="78" rx="39"/>
    <path d="M392 400 h78 v250 q0 58 -46 84 q-26 14 -58 12 l-6 -2 q20 -18 26 -46 q6 -22 6 -48 z"/>
    <path d="M572 400 h78 v248 q0 36 22 46 q18 8 44 -2 l6 60 q-34 16 -76 12 q-74 -8 -74 -100 z"/>
  </g>
  <!-- dev build marker (icon-dev.svg only): a "DEV" band across the bottom -->
  <g clip-path="url(#squircle)">
    <rect x="100" y="770" width="824" height="154" fill="#ff9f0a"/>
    <text x="512" y="880" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="120" font-weight="700" letter-spacing="24" fill="#1d1d1f">DEV</text>
  </g>
</svg>
