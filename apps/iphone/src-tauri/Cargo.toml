[package]
name = "glade-iphone"
version = "0.1.0"
description = "iOS shell for the Glade iPhone app (docs/design/iphone-app.md)"
edition = "2021"
publish = false

[lib]
name = "glade_iphone_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde_json = "1"

[target.'cfg(any(target_os = "ios", target_os = "macos"))'.dependencies]
security-framework = "3"

# QR scanning of the Mac's pairing code (I-164 step 6). Mobile only; registered under #[cfg(mobile)].
[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-barcode-scanner = "2"
